#:schema https://mise.jdx.dev/schema/mise.json
#
# mise configuration for building and installing openduo locally.
#
# openduo is a shell wrapper around the "opencode-ai" npm package rather than a
# released binary, so there is no mise *tool* backend for it. Instead these
# tasks wrap the manual steps from README.md ("From source") so that updating,
# building and installing is a single command:
#
#     mise run update      # git pull + bun install + generate models + test
#     mise run install     # symlink bin/openduo into ~/.local/bin
#
# Run "mise tasks" to list everything.

[tools]
# Pin the toolchain openduo needs. The wrapper shells out to "bun" at runtime
# (for the models catalog and config merge), so bun must be on PATH whenever
# openduo runs, not just at build time.
bun = "latest"

[env]
# Where "mise run install" places the openduo symlink. Override with
# OPENDUO_PREFIX if you prefer somewhere else, e.g.
#   OPENDUO_PREFIX=~/bin mise run install
OPENDUO_PREFIX = "{{ env.OPENDUO_PREFIX | default(value='~/.local/bin') }}"

[tasks.deps]
description = "Install JS dependencies (opencode-ai + dev deps)"
run = "bun install"
sources = ["package.json", "bun.lock"]
outputs = ["node_modules/.bin/opencode"]

[tasks.models]
description = "Regenerate the restricted gitlab models catalog"
run = "bun run generate:models"
depends = ["deps"]

[tasks.test]
description = "Run the security hardening tests"
run = "bun test"
depends = ["deps"]

[tasks.build]
description = "Install deps and regenerate the models catalog"
depends = ["deps", "models"]
run = '''#!/usr/bin/env bash
set -euo pipefail
if [ ! -x node_modules/.bin/opencode ]; then
  echo "error: node_modules/.bin/opencode missing after 'bun install'" >&2
  exit 1
fi
echo "openduo $(bun -e "console.log((await Bun.file('package.json').json()).version)") built"
echo "  opencode-ai: $(bun -e "console.log((await Bun.file('package.json').json()).dependencies['opencode-ai'])")"
'''

[tasks.update]
description = "Pull latest openduo, rebuild, and run tests"
run = '''#!/usr/bin/env bash
set -euo pipefail

# Refuse to clobber local work, but tolerate churn in generated files:
#   bun.lock           - rewritten by "bun install"
#   models/models.json - regenerated from models.dev on every build
dirty="$(git status --porcelain -- . \
  ':(exclude)bun.lock' \
  ':(exclude)models/models.json')"
if [ -n "$dirty" ]; then
  echo "error: working tree has uncommitted changes:" >&2
  echo "$dirty" >&2
  echo "Commit, stash or discard them before running 'mise run update'." >&2
  exit 1
fi

branch="$(git rev-parse --abbrev-ref HEAD)"
echo "==> Updating openduo on branch '$branch'"

if ! git rev-parse --abbrev-ref "@{upstream}" >/dev/null 2>&1; then
  echo "note: '$branch' has no upstream branch; skipping the pull." >&2
  echo "      Set one with: git branch --set-upstream-to=<remote>/$branch" >&2
  skip_pull=1
fi

before="$(git rev-parse HEAD)"
# These are regenerated by the build below; discard local churn so the
# fast-forward pull cannot hit a spurious conflict.
git checkout -- bun.lock models/models.json 2>/dev/null || true
if [ -z "${skip_pull:-}" ]; then
  git pull --ff-only
fi
after="$(git rev-parse HEAD)"

if [ "$before" = "$after" ]; then
  echo "==> Already up to date ($(git rev-parse --short HEAD))"
else
  echo "==> Updated $(git rev-parse --short "$before") -> $(git rev-parse --short "$after")"
  git --no-pager log --oneline "$before..$after"
fi

mise run build
mise run test
'''

[tasks.install]
description = "Symlink bin/openduo into $OPENDUO_PREFIX (default ~/.local/bin)"
depends = ["build"]
run = '''#!/usr/bin/env bash
set -euo pipefail

prefix="${OPENDUO_PREFIX/#\~/$HOME}"
mkdir -p "$prefix"

root="$(git rev-parse --show-toplevel)"
target="$root/bin/openduo"
link="$prefix/openduo"

if [ -e "$link" ] && [ ! -L "$link" ]; then
  echo "error: $link exists and is not a symlink; refusing to overwrite." >&2
  exit 1
fi

ln -sfn "$target" "$link"
echo "==> Linked $link -> $target"

# Warn if the symlink is shadowed by another openduo earlier in PATH.
resolved="$(command -v openduo 2>/dev/null || true)"
if [ -n "$resolved" ] && [ "$resolved" != "$link" ]; then
  echo "note: 'openduo' currently resolves to $resolved" >&2
  echo "      ($prefix may be missing from PATH, or shadowed earlier in it)" >&2
fi
'''

[tasks.uninstall]
description = "Remove the openduo symlink from $OPENDUO_PREFIX"
run = '''#!/usr/bin/env bash
set -euo pipefail
prefix="${OPENDUO_PREFIX/#\~/$HOME}"
link="$prefix/openduo"
if [ -L "$link" ]; then
  rm "$link"
  echo "==> Removed $link"
else
  echo "==> Nothing to remove at $link"
fi
'''

[tasks.info]
description = "Show installed openduo / opencode-ai versions and paths"
run = '''#!/usr/bin/env bash
set -euo pipefail
root="$(git rev-parse --show-toplevel)"
echo "repo:        $root"
echo "branch:      $(git rev-parse --abbrev-ref HEAD) ($(git rev-parse --short HEAD))"
echo "openduo:     $(bun -e "console.log((await Bun.file('package.json').json()).version)")"
echo "opencode-ai: $(bun -e "console.log((await Bun.file('package.json').json()).dependencies['opencode-ai'])")"
if [ -x node_modules/.bin/opencode ]; then
  echo "opencode bin: $(node_modules/.bin/opencode --version 2>/dev/null || echo '(present)')"
else
  echo "opencode bin: MISSING (run 'mise run build')"
fi
echo "bun:         $(bun --version) ($(command -v bun))"
echo "on PATH:     $(command -v openduo 2>/dev/null || echo '(not found)')"
'''
